<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#ff7a59"/>
    </linearGradient>
    <radialGradient id="highlight" cx="35%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Orb Body -->
  <circle cx="32" cy="32" r="30" fill="url(#orbGrad)"/>
  <circle cx="32" cy="32" r="30" fill="url(#highlight)"/>
  <!-- Left Eye -->
  <ellipse cx="26" cy="31" rx="6.5" ry="8.5" fill="#ffffff"/>
  <ellipse cx="27.5" cy="31" rx="3.5" ry="4" fill="#16161d"/>
  <!-- Right Eye -->
  <ellipse cx="40" cy="31" rx="6.5" ry="8.5" fill="#ffffff"/>
  <ellipse cx="41.5" cy="31" rx="3.5" ry="4" fill="#16161d"/>
</svg>
