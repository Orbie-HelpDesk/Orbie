services:
  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
      - ./kb:/kb
      - ./frontend:/frontend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Local test database, never touches Supabase. Only starts with: --profile local-db
  db:
    profiles: ["local-db"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aihas
      POSTGRES_PASSWORD: aihas-local
      POSTGRES_DB: aihas
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihas -d aihas"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Automation service for the mock Jira and Active Directory actions.
  # Only starts with: --profile n8n. Published on this machine only (127.0.0.1).
  n8n:
    profiles: ["n8n"]
    image: n8nio/n8n:${N8N_IMAGE_TAG:-1.70.3}
    ports: ["127.0.0.1:5678:5678"]
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"  # the local page is plain http
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"  # lets the workflows read N8N_WEBHOOK_SECRET
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Manila}
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n:/workflows:ro

volumes:
  pgdata:
  n8ndata:
