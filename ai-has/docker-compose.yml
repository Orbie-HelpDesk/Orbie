services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aihas
      POSTGRES_PASSWORD: aihas
      POSTGRES_DB: aihas
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]

  chroma:
    image: chromadb/chroma:latest
    volumes: [chroma_data:/data]
    ports: ["8001:8000"]

  n8n:
    image: n8nio/n8n:latest
    ports: ["5678:5678"]
    volumes: [n8n_data:/home/node/.n8n]

  backend:
    build: ./backend
    env_file: .env
    depends_on: [db, chroma]
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
      - ./kb:/kb
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
  chroma_data:
  n8n_data:
