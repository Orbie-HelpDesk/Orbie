services:
  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
      - ./kb:/kb
      - ./frontend:/frontend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Local test database, never touches Supabase. Only starts with: --profile local-db
  db:
    profiles: ["local-db"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aihas
      POSTGRES_PASSWORD: aihas-local
      POSTGRES_DB: aihas
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihas -d aihas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
