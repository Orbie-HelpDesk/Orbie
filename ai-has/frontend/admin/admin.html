<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI-HAS · Admin Dashboard</title>
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/admin-assets/admin.css">
</head>
<body class="chatting">
  <!-- Living background (same as chat) -->
  <div class="bg" aria-hidden="true">
    <i class="blob b1"></i>
    <i class="blob b2"></i>
    <i class="blob b3"></i>
  </div>
  <div class="cursor-glow" id="glow" aria-hidden="true"></div>

  <div class="app admin">
    <header class="top">
      <div class="brand">
        <div class="brand-orb">
          <div class="orb" id="headOrb" style="--s:40px"><div class="eyes"><i class="eye"><b class="pupil"></b></i><i class="eye"><b class="pupil"></b></i></div></div>
        </div>
        <div class="title">
          <strong>AI-HAS</strong>
          <small>Admin Dashboard</small>
        </div>
      </div>

      <div class="actions">
        <div class="pill"><i class="led" id="led"></i><span id="status">Linking</span></div>
        <button class="ib" id="refresh" type="button" title="Refresh" aria-label="Refresh">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
        <a class="ib" href="/" title="Back to chat" aria-label="Back to chat">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
        </a>
        <button class="ib" id="theme" type="button" title="Toggle theme" aria-label="Toggle theme">
          <svg class="icon moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <main class="page">
      <section class="intro">
        <h1>Ticket <span>overview</span></h1>
        <p>Everything the assistant escalated, in one place.</p>
      </section>

      <section class="kpis">
        <div class="kpi" style="--i:0;--tint:#6c5ce7">
          <span class="s-ico"><svg class="icon" viewBox="0 0 24 24"><path d="M3 9V6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v3a3 3 0 0 0 0 6v3a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-3a3 3 0 0 0 0-6z"/></svg></span>
          <div><small>Total tickets</small><b id="k-total">-</b></div>
        </div>
        <div class="kpi" style="--i:1;--tint:#ff7a59">
          <span class="s-ico"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
          <div><small>Open</small><b id="k-open">-</b></div>
        </div>
        <div class="kpi" style="--i:2;--tint:#3b82f6">
          <span class="s-ico"><svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
          <div><small>In progress</small><b id="k-progress">-</b></div>
        </div>
        <div class="kpi" style="--i:3;--tint:#2fb86f">
          <span class="s-ico"><svg class="icon" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></span>
          <div><small>Resolved</small><b id="k-resolved">-</b></div>
        </div>
        <div class="kpi" style="--i:4;--tint:#d946a8">
          <span class="s-ico"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
          <div><small>Created today</small><b id="k-today">-</b></div>
        </div>
        <div class="kpi" style="--i:5;--tint:#1fa896">
          <span class="s-ico"><svg class="icon" viewBox="0 0 24 24"><path d="M12 7v5l3 2"/><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/></svg></span>
          <div><small>Avg. resolution</small><b id="k-avg">-</b></div>
        </div>
      </section>

      <section class="panel">
        <h2>Tickets by priority</h2>
        <div class="bars" id="bars"></div>
      </section>

      <section class="panel">
        <h2>Tickets</h2>
        <div class="filters" id="filters">
          <button class="chipbtn on" data-s="" type="button">All</button>
          <button class="chipbtn" data-s="open" type="button">Open</button>
          <button class="chipbtn" data-s="in_progress" type="button">In progress</button>
          <button class="chipbtn" data-s="resolved" type="button">Resolved</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Ref</th><th>Summary</th><th>Priority</th><th>Status</th>
                <th>Requester</th><th>Created</th><th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="/static/field.js"></script>
  <script src="/admin-assets/admin.js"></script>
</body>
</html>
