<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Orbie</title>
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/login-assets/login.css">
</head>
<body>
  <!-- Living background, same as the chat -->
  <div class="bg" aria-hidden="true">
    <i class="blob b1"></i>
    <i class="blob b2"></i>
    <i class="blob b3"></i>
  </div>
  <div class="cursor-glow" id="glow" aria-hidden="true"></div>

  <button class="ib login-theme" id="theme" type="button" title="Toggle theme" aria-label="Toggle theme">
    <svg class="icon moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="icon sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>

  <main class="login">
    <div class="orb" id="loginOrb" style="--s:96px"><div class="eyes"><i class="eye"><b class="pupil"></b></i><i class="eye"><b class="pupil"></b></i></div></div>
    <h1>Welcome back to <span>Orbie</span></h1>
    <p class="sub">Sign in to ask the IT helpdesk.</p>

    <form id="loginForm" class="login-card" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>

      <label for="password">Password</label>
      <div class="password-wrapper">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password" title="Show password">
          <svg class="icon eye-show" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon eye-hide" viewBox="0 0 24 24" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>

      <p class="login-error" id="error" role="alert"></p>

      <button class="ticket-btn login-submit" id="submit" type="submit">Sign in</button>
    </form>
    <p class="hint">Never share your password with anyone, including Orbie.</p>
  </main>

  <script src="/static/field.js"></script>
  <script src="/login-assets/login.js"></script>
</body>
</html>
